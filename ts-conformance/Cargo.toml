[package]
name = "ts-conformance"
version = "0.1.0"
edition = "2024"
description = "TypeScript conformance testing and benchmarking for zelda"

[[bin]]
name = "ts-conformance"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
rayon = "1"
glob = "0.3"

# Reporting
comfy-table = "7"
indicatif = "0.17"
console = "0.15"

# Snapshots
insta = { version = "1.40", features = ["yaml"] }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "type_checking"
harness = false
