[package]
name = "ts-conformance"
version = "0.1.0"
edition = "2024"
description = "Runs zelda against TypeScript's own test suite, using tsc's reference baselines as the oracle"
publish = false
autobenches = false

[[bin]]
name = "ts-conformance"
path = "src/main.rs"

[dependencies]
zelda = { path = ".." }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
rayon = "1"
indicatif = "0.18"
tempfile = "3"
wait-timeout = "0.2"
