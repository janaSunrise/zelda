[workspace]
members = [".", "ts-conformance"]
resolver = "3"

[package]
name = "zelda"
version = "0.1.0"
edition = "2024"

[dependencies]
oxc_parser = "0.110"
oxc_ast = "0.110"
oxc_allocator = "0.110"
oxc_span = "0.110"
oxc_diagnostics = "0.110"
clap = { version = "4.5", features = ["derive", "color"] }
miette = { version = "7.6", features = ["fancy"] }
owo-colors = "4.2"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustc-hash = "2.1"
rayon = "1.11"

[dev-dependencies]
tempfile = "3"
